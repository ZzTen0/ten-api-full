spring:
  application:
    name: ten-api-backend
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ten_api?useAffectedRows=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  # session 失效时间（分钟）
  session:
    timeout: 86400
    store-type: redis
  # redis 配置
  redis:
    port: 6379
    host: localhost
    database: 0
    password: ${SPRING_REDIS_PASSWORD:}
server:
  port: 7529
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 200
    max-connections: 2000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
# Dubbo 配置
dubbo:
  application:
    name: ten-api-backend-provider
    logger: slf4j
  registry:
    address: zookeeper://127.0.0.1:2181
    timeout: 30000
    session-timeout: 60000
  protocol:
    name: dubbo
    port: 20880
  provider:
    timeout: 2000
    retries: 0
    threadpool: fixed
    threads: 50
    queues: 200
    accepts: 500
  consumer:
    timeout: 2000
    retries: 0
    check: false
  scan:
    base-packages: com.ten.project.dubbo

# Curator 配置（确保ZK连接稳定）
curator:
  connectionTimeoutMs: 30000
  sessionTimeoutMs: 60000
  maxRetries: 3
  baseSleepTimeMs: 1000
